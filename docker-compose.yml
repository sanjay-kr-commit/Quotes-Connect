services:
  quotes-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quotes-connect-server
    restart: unless-stopped

    ports:
      - "${QUOTES_PUBLISH_HTTP_PORT:-8080}:8080"
      - "${QUOTES_PUBLISH_HTTPS_PORT:-8443}:8443"

    environment:
      QUOTES_SERVER_HOST: "${QUOTES_SERVER_HOST:-0.0.0.0}"
      QUOTES_SERVER_PORT: "${QUOTES_SERVER_PORT:-8080}"
      QUOTES_SERVER_PROTOCOL: "${QUOTES_SERVER_PROTOCOL:-HTTP}"

      QUOTES_DATABASE_MODE: "${QUOTES_DATABASE_MODE:-SQLITE}"
      QUOTES_DATABASE_URL: "${QUOTES_DATABASE_URL:-}"
      QUOTES_DATABASE_USERNAME: "${QUOTES_DATABASE_USERNAME:-}"
      QUOTES_DATABASE_PASSWORD: "${QUOTES_DATABASE_PASSWORD:-}"
      QUOTES_SQLITE_PATH: "${QUOTES_SQLITE_PATH:-/data/quotes_connect.db}"

      QUOTES_TLS_ENABLED: "${QUOTES_TLS_ENABLED:-false}"
      QUOTES_TLS_KEYSTORE: "${QUOTES_TLS_KEYSTORE:-}"
      QUOTES_TLS_KEY_ALIAS: "${QUOTES_TLS_KEY_ALIAS:-quotesconnect}"
      QUOTES_TLS_KEYSTORE_PASSWORD: "${QUOTES_TLS_KEYSTORE_PASSWORD:-}"
      QUOTES_TLS_KEY_PASSWORD: "${QUOTES_TLS_KEY_PASSWORD:-}"
      QUOTES_CONFIG_FILE: "${QUOTES_CONFIG_FILE:-}"

    volumes:
      - quotes-connect-data:/data
      - ./server/config:/config:ro
      - ./secrets:/run/secrets:ro

volumes:
  quotes-connect-data:
