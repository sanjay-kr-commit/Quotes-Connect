# Quotes Connect server defaults.
# Environment variables named QUOTES_* override these values.
server.host=0.0.0.0
server.port=8080
server.protocol=HTTP

database.mode=SQLITE
database.sqlite.path=quotes_connect.db

tls.enabled=false
tls.keystore=
tls.keystore.password=quotesconnect
tls.key.alias=quotesconnect
tls.key.password=quotesconnect
